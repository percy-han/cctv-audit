worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  include       /etc/nginx/mime.types;
  # Not in nginx's default table, and getting them wrong is not cosmetic:
  # Chromium refuses to hand an `application/octet-stream` manifest to hls.js,
  # so the page plays nothing and the probe sees no stream -- which looks
  # exactly like "Plan A does not work".
  types {
    application/vnd.apple.mpegurl m3u8;
    video/mp2t                    ts;
  }
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  # Seeking is the whole point here: the audit jumps to an offset before it
  # records anything, and that is a Range request.
  max_ranges 100;

  server {
    listen 8080;
    server_name _;
    root /srv/video;

    location = /healthz { return 200 "ok\n"; }

    # Playlists must not be cached: a stale manifest outlives a redeploy.
    location ~ \.m3u8$ { add_header Cache-Control "no-store"; }
    # Segments and the file never change within a build.
    location ~ \.(ts|mp4|js)$ { add_header Cache-Control "public, max-age=3600"; }

    location / { try_files $uri $uri/ =404; }
  }
}
